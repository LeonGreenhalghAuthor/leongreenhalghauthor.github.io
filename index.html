<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Leon Greenhalgh | The Screaming Glass</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>

        <h1>Leon Greenhalgh</h1>

    </header>

    <main class="hero">

        <section class="hero-image">

            <img
                src="images/the-screaming-glass-cover.jpg"
                alt="The Screaming Glass book cover"
                class="book-cover">

        </section>

        <section class="hero-content">

            <img
                src="images/screaming-glass-logo.svg"
                alt="The Screaming Glass"
                class="book-logo">

            <p class="series">
                Book One of the Shardfall Series
            </p>

            <a
                href="https://amzn.eu/d/0aYtaqNu"
                class="buy-button"
                target="_blank"
                rel="noopener">

                Available now on Amazon & Kindle Unlimited

            </a>

        </section>

    </main>

</body>

</html>
