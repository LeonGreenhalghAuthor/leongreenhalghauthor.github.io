<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Leon Greenhalgh | The Screaming Glass</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>

        <nav>
    
            <div class="site-title">

            <a

                rel="noopener">

        </section>

            src="images/Crystal_White.png"

            <h2>Shardfall</h2>

            </p>
